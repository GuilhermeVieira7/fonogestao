{% extends 'base.html' %}
{% block title %}Senha Redefinida - FonoGestão{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 p-4 text-center" style="box-shadow:var(--shadow);">
            <div style="width:64px;height:64px;background:#dcfce7;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                <i class="bi bi-shield-fill-check text-success fs-3"></i>
            </div>
            <h4 class="fw-700 mb-2">Senha redefinida!</h4>
            <p class="text-muted mb-4" style="font-size:.875rem;">Sua senha foi atualizada com sucesso. Faca login para continuar.</p>
            <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ir para o Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
