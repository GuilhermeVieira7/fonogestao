{% extends 'base.html' %}
{% block title %}Recuperar Senha - FonoGestão{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 p-4" style="box-shadow:var(--shadow);">
            <div class="text-center mb-4">
                <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
                    <i class="bi bi-envelope-fill text-white fs-4"></i>
                </div>
                <h4 class="fw-700 mb-1" style="letter-spacing:-.3px;">Recuperar Senha</h4>
                <p class="text-muted" style="font-size:.875rem;">Informe seu e-mail e enviaremos instruções para redefinir sua senha.</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label">E-mail cadastrado</label>
                    <input type="email" name="email" class="form-control" id="id_email" placeholder="seu@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill">
                    <i class="bi bi-send me-2"></i>Enviar instruções
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-decoration-none text-muted" style="font-size:.82rem;">
                    <i class="bi bi-arrow-left me-1"></i>Voltar ao login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
