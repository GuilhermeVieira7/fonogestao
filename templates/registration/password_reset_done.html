{% extends 'base.html' %}
{% block title %}E-mail Enviado - FonoGestão{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 p-4 text-center" style="box-shadow:var(--shadow);">
            <div style="width:64px;height:64px;background:#dcfce7;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                <i class="bi bi-check-circle-fill text-success fs-3"></i>
            </div>
            <h4 class="fw-700 mb-2">E-mail enviado!</h4>
            <p class="text-muted mb-4" style="font-size:.875rem;">
                Verifique sua caixa de entrada e siga as instruções para redefinir sua senha. O link é válido por 24 horas.
            </p>
            <a href="{% url 'login' %}" class="btn btn-outline-primary rounded-pill">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao login
            </a>
        </div>
    </div>
</div>
{% endblock %}
